name: ShopSolution CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsotf.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
	  MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.SQL_SA_PASSWORD }}
        ports:
	  - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
	  --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    env:
      ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=ShopDb_Test;User Id=sa;Password=${{ secrets.SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False;"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ShopSolution.slnx

      - name: Build
        run: dotnet build ShopSolution.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ShopSolution.slnx --no-build --configuration Release
